<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Advenoh Status — Redesign Explorations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Pretendard:wght@300;400;500;600;700;800&family=Inter+Tight:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: dark light; }
  *,*::before,*::after { box-sizing: border-box; }
  html,body { margin:0; padding:0; }
  body {
    font-family: 'Pretendard', 'Geist', system-ui, -apple-system, sans-serif;
    background: #0a0a0a;
    color: #fafafa;
    min-height: 100vh;
    overflow-x: hidden;
  }
  #root { min-height: 100vh; }
  .mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Geist Mono', ui-monospace, monospace; }

  /* --- Scrollbars kept minimal --- */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 0; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.2); }

  /* --- Tweaks panel shared --- */
  .tweaks-panel {
    position: fixed; right: 20px; bottom: 20px; z-index: 9999;
    background: rgba(18,18,18,.94); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px; padding: 16px 18px; width: 280px;
    font-family: 'JetBrains Mono', monospace; color: #fafafa;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .tweaks-panel h4 {
    margin: 0 0 10px; font-size: 11px; letter-spacing: .18em;
    text-transform: uppercase; color: rgba(255,255,255,.55); font-weight: 600;
  }
  .tweak-row { margin-bottom: 14px; }
  .tweak-row:last-child { margin-bottom: 0; }
  .tweak-label { font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: rgba(255,255,255,.45); margin-bottom: 6px; display:block; }
  .tweak-btn-group { display:flex; gap: 4px; }
  .tweak-btn {
    flex:1; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
    color: rgba(255,255,255,.7); padding: 6px 8px; font-size: 11px;
    font-family: inherit; cursor:pointer; border-radius: 6px;
    transition: all .15s; letter-spacing: .04em;
  }
  .tweak-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
  .tweak-btn.active {
    background: #fafafa; color: #000; border-color: #fafafa; font-weight: 600;
  }
  .tweak-toggle {
    width: 100%; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
    color: rgba(255,255,255,.7); padding: 7px 10px; font-size: 11px;
    font-family: inherit; cursor: pointer; border-radius: 6px;
    display:flex; justify-content: space-between; align-items: center;
  }
  .tweak-toggle.on { background: rgba(255,255,255,.1); color: #fff; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="./src/data.jsx"></script>
<script type="text/babel" src="./src/variants/glass.jsx"></script>
<script type="text/babel" src="./src/app.jsx"></script>
</body>
</html>
